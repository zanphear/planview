name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No em/en dashes (forbidden-23)
        run: ./scripts/check-no-dashes.sh

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System libs (python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -e ".[dev]"
      - run: ruff check app/
      - run: ruff format --check app/
      - name: Type-check (mypy)
        env:
          JWT_SECRET_KEY: ci-throwaway-secret-not-used-in-production-0123456789
        run: mypy app/

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planview
          POSTGRES_PASSWORD: planview_test
          POSTGRES_DB: planview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Ephemeral CI database, never a real one.
      TEST_DATABASE_URL: postgresql+asyncpg://planview:planview_test@localhost:5432/planview_test
      DATABASE_URL: postgresql+asyncpg://planview:planview_test@localhost:5432/planview_test
      # config.py refuses to start with the default secret; supply a throwaway.
      JWT_SECRET_KEY: ci-throwaway-secret-not-used-in-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System libs (python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=app --cov-report=term-missing

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Build (tsc strict + vite)
        run: npm run build
      - name: Bundle budget (forbidden-27)
        run: node scripts/check-bundle-budget.mjs

  openapi-types:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-throwaway-secret-not-used-in-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System libs (python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Dump OpenAPI schema
        working-directory: backend
        run: python scripts/dump_openapi.py
      - name: Generate TS types from the schema (ADR 0006)
        working-directory: frontend
        run: npm run gen:api
      - name: Fail on schema drift (committed schema.ts is stale)
        run: git diff --exit-code frontend/src/api/schema.ts

  docker-build:
    needs: [repo-hygiene, backend-lint, backend-test, frontend-checks, openapi-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Backend image
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: |
            wgf007/planview-api:latest
            wgf007/planview-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: |
            wgf007/planview-ui:latest
            wgf007/planview-ui:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
