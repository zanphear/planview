services:
  planview-db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planview_secret}
      POSTGRES_DB: ${POSTGRES_DB:-planview}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planview}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  planview-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-planview_redis_secret}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-planview_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  planview-web:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://planview:planview_secret@planview-db:5432/planview}
      REDIS_URL: ${REDIS_URL:-redis://:planview_redis_secret@planview-redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-random-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
      UPLOAD_DIR: /app/uploads
      AI_MODEL_URL: ${AI_MODEL_URL:-https://analyst.local.envy.sh/v1}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-analyst}
      AUTH_MODE: ${AUTH_MODE:-password}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-true}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-regular}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      planview-db:
        condition: service_healthy
      planview-redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  planview-ui:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - planview-web
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  planview-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - planview-web
      - planview-ui
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  postgres_data:
  uploads:
